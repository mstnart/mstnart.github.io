# Builds the static export and publishes it to GitHub Pages on every push to main.
# Repo must be named <username>.github.io so the site is served from the domain root
# (media paths in src/content are root-relative, e.g. /media/videos/...).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - name: Require a root-level site
        if: steps.pages.outputs.base_path != ''
        run: |
          echo "::error::This site must be served from the domain root. Rename the repo to <username>.github.io (current path: ${{ steps.pages.outputs.base_path }})."
          exit 1

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
